<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Style Profile 👤 — Elizabeth's Elegance</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           My Profile — Premium Dark Page
        ========================================================= */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --ai-purple:#a855f7;--ai-pink:#ec4899;--ai-gold:#f59e0b;
            --glass-bg:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.12);
            --glass-shadow:0 8px 32px rgba(0,0,0,0.35);
        }

        body{
            font-family:'Outfit',sans-serif;
            background:#0f0c29;
            min-height:100vh;
            color:#f1f5f9;
            line-height:1.6;
            overflow-x:hidden;
            display:flex; flex-direction:column;
        }

        /* Animated gradient BG */
        body::before{
            content:'';position:fixed;inset:0;z-index:-2;
            background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
        }
        body::after{
            content:'';position:fixed;inset:0;z-index:-1;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(168,85,247,0.18) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 80%, rgba(236,72,153,0.14) 0%, transparent 45%);
            animation:bgPulse 12s ease-in-out infinite alternate;
            pointer-events:none;
        }
        @keyframes bgPulse{ from{opacity:0.8;} to{opacity:1;} }

        a{color:inherit;text-decoration:none;}

        /* ---- TOP NAV ---- */
        .ai-nav{
            position:relative;z-index:20;
            display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;
            padding:20px 40px;
            border-bottom:1px solid var(--glass-border);
            background:rgba(15,12,41,0.6);
            backdrop-filter:blur(20px);
        }
        .ai-brand{
            font-family:'Great Vibes',cursive;font-size:34px;color:white;
            filter:drop-shadow(0 0 18px rgba(168,85,247,0.5));
        }
        .nav-links{display:flex;gap:10px;flex-wrap:wrap;}
        .nav-link{
            color:rgba(255,255,255,0.65);font-size:13px;font-weight:500;
            padding:8px 16px;border-radius:20px;
            border:1px solid var(--glass-border);background:var(--glass-bg);
            transition:all .25s;
        }
        .nav-link:hover,.nav-link.active{
            color:#fff;background:rgba(168,85,247,0.18);
            border-color:rgba(168,85,247,0.45);
        }

        /* ---- MAIN CONTAINER ---- */
        .main-content {
            flex:1; display:flex; flex-direction:column; align-items:center;
            padding: clamp(25px, 5vw, 40px) clamp(15px, 4vw, 20px); position:relative; z-index:10;
            box-sizing:border-box; max-width:100%;
        }

        .hero-title {
            font-family:'Great Vibes',cursive;
            font-size:clamp(32px, 5.5vw, 56px);
            line-height:1.25;
            background:linear-gradient(135deg,#fff 0%,var(--ai-purple) 45%,var(--ai-pink) 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            margin-bottom:10px; text-align:center;
            display:inline-block; max-width:100%;
            padding:4px 10px 8px; box-sizing:border-box;
            overflow-wrap:break-word; word-break:break-word;
        }
        .hero-subtitle {
            font-size:15px; color:rgba(255,255,255,0.6); text-align:center;
            margin-bottom:30px; max-width:500px; line-height:1.5;
        }

        /* ---- PROFILE FORM ---- */
        .profile-card {
            width:100%; max-width:600px;
            background:var(--glass-bg);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid var(--glass-border); border-radius:24px;
            padding:clamp(22px, 4vw, 40px); box-shadow:var(--glass-shadow);
            box-sizing:border-box; margin-bottom:25px;
        }

        /* ---- STYLE DNA SECTION ---- */
        .style-dna-card {
            width:100%; max-width:600px;
            background:rgba(255,255,255,0.04);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(168,85,247,0.3); border-radius:24px;
            padding:clamp(20px, 4vw, 32px); box-shadow:var(--glass-shadow);
            box-sizing:border-box; animation:fadeIn .4s ease;
        }
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .dna-card-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
        .dna-icon { font-size:28px; }
        .dna-title { font-size:18px; font-weight:700; color:#fff; margin:0 0 4px; }
        .dna-subtitle { font-size:12px; color:rgba(255,255,255,0.5); margin:0; }
        .dna-styles-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
        .dna-style-badge {
            flex:1; min-width:200px; background:rgba(255,255,255,0.05);
            border:1px solid var(--glass-border); border-radius:14px;
            padding:12px 16px; display:flex; flex-direction:column; gap:4px;
        }
        .dna-style-badge.primary { border-color:rgba(168,85,247,0.4); background:rgba(168,85,247,0.1); }
        .dna-style-badge.secondary { border-color:rgba(236,72,153,0.3); background:rgba(236,72,153,0.08); }
        .badge-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.6); font-weight:600; }
        .dna-style-badge strong { font-size:15px; color:#fff; }
        .dna-breakdown { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
        .dna-bar-item { display:flex; flex-direction:column; gap:5px; }
        .dna-bar-info { display:flex; justify-content:space-between; font-size:13px; color:rgba(255,255,255,0.8); }
        .dna-bar-info span:first-child { font-weight:500; }
        .dna-bar-info span:last-child { font-weight:700; color:var(--ai-pink); }
        .dna-bar-track { width:100%; height:8px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
        .dna-bar-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--ai-purple),var(--ai-pink)); transition:width .5s ease; }
        .dna-footer { text-align:center; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); }
        .dna-retake-btn {
            display:inline-block; font-size:13px; font-weight:600; color:rgba(255,255,255,0.8);
            text-decoration:none; padding:8px 18px; border-radius:18px;
            background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
            transition:all .2s;
        }
        .dna-retake-btn:hover { background:rgba(168,85,247,0.2); border-color:var(--ai-purple); color:#fff; }

        @media (max-width: 680px) {
            .ai-nav { padding: 15px 20px; }
        }

        .form-group { margin-bottom: 25px; }
        .form-label {
            display:block; font-size:13px; font-weight:600; color:rgba(255,255,255,0.8);
            text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;
        }
        
        .form-input, .form-select {
            width:100%; padding:14px 18px;
            background:rgba(0,0,0,0.2);
            border:1px solid var(--glass-border); border-radius:12px;
            color:white; font-family:'Outfit',sans-serif; font-size:15px;
            transition:all 0.3s;
        }
        .form-input:focus, .form-select:focus {
            outline:none; border-color:var(--ai-purple); box-shadow:0 0 15px rgba(168,85,247,0.3);
            background:rgba(0,0,0,0.4);
        }
        .form-select option { background:#24243e; color:white; }

        .btn-save {
            width:100%; padding:16px; border-radius:14px; border:none;
            background:linear-gradient(135deg,#7c3aed,#ec4899); color:white;
            font-family:'Outfit',sans-serif; font-size:16px; font-weight:700; cursor:pointer;
            transition:all 0.3s; margin-top:10px;
        }
        .btn-save:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(236,72,153,0.4); }

        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:rgba(16, 185, 129, 0.9); color:white; padding:12px 24px;
            border-radius:30px; font-weight:600; font-size:14px; z-index:1000;
            opacity:0; transition:opacity 0.4s; pointer-events:none;
        }
    </style>
</head>
<body>
    <nav class="ai-nav">
        <a href="index.html" class="ai-brand">Elizabeth's Elegance</a>
        <div class="nav-links" id="nav-container">
            <!-- Injected by script for consistency -->
        </div>
    </nav>

    <div class="main-content">
        <h1 class="hero-title">My Digital Profile</h1>
        <p class="hero-subtitle">Розкажіть трохи про себе, щоб штучний інтелект міг адаптувати рекомендації, капсули та образи особисто для вас.</p>

        <div class="profile-card">
            <form id="profile-form" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label class="form-label">Ваше ім'я</label>
                    <input type="text" id="p-name" class="form-input" placeholder="Наприклад, Анна" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Ваш вік</label>
                    <input type="number" id="p-age" class="form-input" placeholder="Вік (років)" min="14" max="100" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Тип фігури (Силует)</label>
                    <select id="p-body" class="form-select">
                        <option value="hourglass">⌛ Пісочний годинник</option>
                        <option value="pear">🍐 Груша (Трикутник)</option>
                        <option value="apple">🍎 Яблуко</option>
                        <option value="rectangle">📏 Прямокутник</option>
                        <option value="inverted">🔻 Перевернутий трикутник</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Основний стиль (з Style Quiz)</label>
                    <select id="p-style" class="form-select">
                        <option value="classic">🖤 Classic Chic</option>
                        <option value="boho">🌿 Boho Free Spirit</option>
                        <option value="minimalist">⬜ Modern Minimalist</option>
                        <option value="romantic">🎀 Romantic Dreamer</option>
                        <option value="streetwear">🧢 Streetwear Bold</option>
                        <option value="elegant">✨ Glamour & Elegance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Улюблений колір (для Капсули)</label>
                    <input type="color" id="p-color" class="form-input" value="#7c3aed" style="height:55px; padding:5px 10px; cursor:pointer;">
                </div>

                <button type="submit" class="btn-save">✨ Зберегти профіль</button>
            </form>
        </div>

        <!-- STYLE DNA SECTION -->
        <div id="style-dna-section" class="style-dna-card" style="display:none;">
            <div class="dna-card-header">
                <span class="dna-icon">🧬</span>
                <div>
                    <h3 class="dna-title">Ваш Style DNA</h3>
                    <p class="dna-subtitle">Сформований на основі вашого Style DNA Quiz</p>
                </div>
            </div>
            <div class="dna-styles-row">
                <div class="dna-style-badge primary">
                    <span class="badge-label">Основний стиль</span>
                    <strong id="dna-primary-style">—</strong>
                </div>
                <div class="dna-style-badge secondary" id="dna-secondary-badge" style="display:none;">
                    <span class="badge-label">Додатковий стиль</span>
                    <strong id="dna-secondary-style">—</strong>
                </div>
            </div>
            <div class="dna-breakdown" id="dna-breakdown"></div>
            <div class="dna-footer">
                <a href="style-quiz.html" class="dna-retake-btn">🎯 Оновити Style DNA у Quiz</a>
            </div>
        </div>
    </div>

    <script>
        const STYLE_META = {
            classic: { name: 'Classic Chic', emoji: '🖤' },
            boho: { name: 'Boho Free Spirit', emoji: '🌿' },
            minimalist: { name: 'Modern Minimalist', emoji: '⬜' },
            romantic: { name: 'Romantic Dreamer', emoji: '🎀' },
            streetwear: { name: 'Streetwear Bold', emoji: '🧢' },
            elegant: { name: 'Glamour & Elegance', emoji: '✨' }
        };

        function renderStyleDNA(data) {
            const sec = document.getElementById('style-dna-section');
            if (!sec || !data || !data.styleDNA) {
                if (sec) sec.style.display = 'none';
                return;
            }

            const pStyle = data.style || '';
            const pMeta = STYLE_META[pStyle] || { name: pStyle || 'Не визначено', emoji: '✨' };
            document.getElementById('dna-primary-style').textContent = `${pMeta.emoji} ${pMeta.name}`;

            const secBadge = document.getElementById('dna-secondary-badge');
            if (data.secondaryStyle && data.secondaryStyle !== data.style && STYLE_META[data.secondaryStyle]) {
                const sMeta = STYLE_META[data.secondaryStyle];
                document.getElementById('dna-secondary-style').textContent = `${sMeta.emoji} ${sMeta.name}`;
                secBadge.style.display = 'flex';
            } else {
                secBadge.style.display = 'none';
            }

            const breakdown = document.getElementById('dna-breakdown');
            const entries = Object.entries(data.styleDNA)
                .filter(([_, pct]) => Number(pct) > 0)
                .sort((a, b) => Number(b[1]) - Number(a[1]));

            if (entries.length > 0) {
                breakdown.innerHTML = entries.map(([k, pct]) => {
                    const meta = STYLE_META[k] || { name: k, emoji: '✨' };
                    return `
                        <div class="dna-bar-item">
                            <div class="dna-bar-info">
                                <span>${meta.emoji} ${meta.name}</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="dna-bar-track">
                                <div class="dna-bar-fill" style="width: ${pct}%;"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                breakdown.innerHTML = '';
            }

            sec.style.display = 'block';
        }

        // Inject Nav
        document.getElementById('nav-container').innerHTML = `
            <a href="index.html" class="nav-link">🏠 Головна</a>
            <a href="my-profile.html" class="nav-link active">👤 Мій профіль</a>
            <a href="ai-stylist.html" class="nav-link">✨ AI Stylist</a>
            <a href="my-wardrobe.html" class="nav-link">👚 Мій гардероб</a>
            <a href="style-quiz.html" class="nav-link">🎯 Style Quiz</a>
            <a href="weather-outfit.html" class="nav-link">🌡️ Weather</a>
            <a href="category-stats.html" class="nav-link">📊 Тренди</a>
        `;

        // Load data on init
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('ai_profile');
            if(saved) {
                try {
                    const data = JSON.parse(saved);
                    if(data.name) document.getElementById('p-name').value = data.name;
                    if(data.age) document.getElementById('p-age').value = data.age;
                    if(data.body) document.getElementById('p-body').value = data.body;
                    if(data.style) document.getElementById('p-style').value = data.style;
                    if(data.color) document.getElementById('p-color').value = data.color;
                    renderStyleDNA(data);
                } catch(e) {}
            }
        });

        function saveProfile(e) {
            e.preventDefault();
            let existing = {};
            try { existing = JSON.parse(localStorage.getItem('ai_profile')) || {}; } catch(err) {}

            const data = {
                ...existing,
                name: document.getElementById('p-name').value.trim(),
                age: document.getElementById('p-age').value,
                body: document.getElementById('p-body').value,
                style: document.getElementById('p-style').value || existing.style || '',
                color: document.getElementById('p-color').value,
                updatedAt: new Date().toISOString()
            };
            localStorage.setItem('ai_profile', JSON.stringify(data));
            renderStyleDNA(data);
            showToast('✨ Профіль успішно збережено!');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            requestAnimationFrame(() => { t.style.opacity = '1'; });
            setTimeout(() => { t.style.opacity = '0'; }, 2500);
            setTimeout(() => { t.remove(); }, 3000);
        }
    </script>
</body>
</html>
